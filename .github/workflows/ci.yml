name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "ci-placeholder"
      ADMIN_IDS: "1"
      SPIDER_API_KEY: "ci-placeholder"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Import bot
        run: python -c "import bot"

      - name: Initialize database
        env:
          RAILWAY_VOLUME_MOUNT_PATH: ${{ runner.temp }}/raqamchi-ci
        run: |
          mkdir -p "$RAILWAY_VOLUME_MOUNT_PATH"
          python -c "import asyncio, database; asyncio.run(database.init_db())"

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      EC2_DEPLOY_PATH: /home/ubuntu/raqamchibot

    steps:
      - name: Configure SSH
        run: |
          test -n "$EC2_HOST" || { echo "Missing GitHub secret: EC2_HOST"; exit 1; }
          test -n "$EC2_USER" || { echo "Missing GitHub secret: EC2_USER"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "Missing GitHub secret: EC2_SSH_KEY"; exit 1; }
          test -n "$EC2_KNOWN_HOSTS" || { echo "Missing GitHub secret: EC2_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ec2_deploy ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh \
            -i ~/.ssh/ec2_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "cd '$EC2_DEPLOY_PATH' && \
             git fetch origin master && \
             git merge --ff-only FETCH_HEAD && \
             .venv/bin/pip install -r requirements.txt && \
             sudo -n systemctl restart raqamchibot.service && \
             sudo -n systemctl is-active --quiet raqamchibot.service"
