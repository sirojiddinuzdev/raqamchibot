name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "ci-placeholder"
      ADMIN_IDS: "1"
      SPIDER_API_KEY: "ci-placeholder"
      RAILWAY_VOLUME_MOUNT_PATH: ${{ runner.temp }}/raqamchi-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Import bot
        run: python -c "import bot"

      - name: Initialize database
        run: |
          mkdir -p "$RAILWAY_VOLUME_MOUNT_PATH"
          python -c "import asyncio, database; asyncio.run(database.init_db())"
